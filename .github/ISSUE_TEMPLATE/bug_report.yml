name: 🐞 Bug
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happens
      description: What the router does, and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: The settings, the load, the conditions in which it happens.
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Motherboard (PCB_VERSION)
      options:
        - OLD_SEG (Robin's Mk2 board, 7-segment display)
        - OLD_OLED (the second old board, OLED)
        - NEW (the universal board)
    validations:
      required: true
  - type: input
    attributes:
      label: Build
      description: The PlatformIO environment (basic, basic_debug, uno), or the Arduino IDE.
      placeholder: basic
    validations:
      required: true
  - type: input
    attributes:
      label: Firmware version
      description: The branch and commit printed at startup, or a release tag.
    validations:
      required: false
  - type: input
    attributes:
      label: Settings in use
      description: |
        TYPE_OF_DISPLAY, DIVERTED_CT_PRESENT, SERIAL_OUTPUT_TYPE, relays, remote loads...
      placeholder: 'OLED, CT2 fitted, IoT (mk2Wifi), one relay'
    validations:
      required: false
  - type: input
    attributes:
      label: RF module
      description: If any - RFM69W/CW or RFM69HW/HCW, the band, the number of remote units.
    validations:
      required: false
  - type: input
    attributes:
      label: Installation
      description: Grid voltage and frequency, the loads and their power.
      placeholder: '230 V 50 Hz, 3 kW water heater'
    validations:
      required: false
  - type: textarea
    attributes:
      label: Serial monitor output
      description: The startup lines and the lines around the problem.
      render: text
    validations:
      required: false
  - type: textarea
    attributes:
      label: config.h
      description: The settings you changed from the shipped config.h.
      render: cpp
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: Measurements, photos, oscilloscope traces... You can drag files into this area.
    validations:
      required: false
